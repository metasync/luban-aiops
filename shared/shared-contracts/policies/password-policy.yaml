# Password-strength policy contract (v1).
#
# Scope: the single source of truth for generated-password strength
# (SPEC-062 R-2). The tool-gateway `secrets.generate_password` connector reads
# it through `PasswordPolicyStore`; the knowledge skill (R-6) cites it **by
# reference** rather than restating numbers. Gateway env overrides may only
# TIGHTEN a policy (raise min_length, add required classes, enable
# exclude_ambiguous), never weaken it below the floor declared here — enforced
# fail-fast in `GatewaySettings.__post_init__` and pinned against connector drift
# by `validate-password-policy` (a `make verify` leg, mirroring
# `validate-secret-vocabulary`).
#
# Version discipline: `version` is the *contract format* version, bumped only
# when the shape below changes (a new field, a renamed key) — not on every value
# tweak. This mirrors the policy bundle, whose `version` is likewise a format
# marker pinned by its validator.
#
# Shape: a `policies` map keyed by name. v1 ships exactly one entry, `default`.
# Named policies (`strict`, ...) are purely additive later — a new key here plus
# a `policy` lookup in the connector, touching no caller (SPEC-062 R-2). A test
# asserts that additivity.
#
# Field semantics (enforced by the connector):
#   - min_length: the length a generated value is raised to when a caller asks
#     for less; a caller may request more.
#   - hard_floor: the absolute minimum. A request below it (after any env
#     tightening) is refused with INVALID_PARAMETERS, never satisfied weakly.
#   - required_classes: every listed class must appear at least once. The
#     non-alphabetic requirement is explicit via `symbol`. Valid classes are
#     exactly {upper, lower, digit, symbol}.
#   - entropy_floor_bits: a backstop — generation guarantees
#     length * log2(alphabet_size) >= this. 16 chars over the ~94-char printable
#     alphabet is ~100+ bits, so `default` meets 64 comfortably.
#   - exclude_ambiguous: drop visually-ambiguous glyphs (I/l/1/O/0). Optional;
#     default off, because the value is copied or emailed rather than retyped
#     from a screen, so entropy-first wins. A caller may enable it.
#
# Not in v1: dictionary / breached-corpus checks (needs a breach list; noted as
# future work in the spec Non-Goals).
version: 1
policies:
  default:
    min_length: 16
    hard_floor: 12
    required_classes: ["upper", "lower", "digit", "symbol"]
    entropy_floor_bits: 64
    exclude_ambiguous: false
