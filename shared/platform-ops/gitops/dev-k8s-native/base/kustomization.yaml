apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev-luban-aiops
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: platform-runtime-config
    behavior: merge
    envs:
      - agent-platform/runtime-config.env
      - tool-gateway/runtime-config.env
resources:
  - ../../dev-k8s-transitional/base
patches:
  - path: agent-platform/patch-deployment.yaml
  - path: agent-platform/patch-service.yaml
