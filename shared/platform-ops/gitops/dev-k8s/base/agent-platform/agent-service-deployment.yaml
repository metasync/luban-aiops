apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: agent-service
          image: luban-aiops/agent-service:dev-local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-runtime-config
            - configMapRef:
                name: agent-platform-runtime-profile
            - secretRef:
                name: agent-platform-runtime-secrets
                optional: true
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: agent-workspaces
              mountPath: /var/lib/luban-aiops/workspaces
      volumes:
        - name: agent-workspaces
          emptyDir: {}
