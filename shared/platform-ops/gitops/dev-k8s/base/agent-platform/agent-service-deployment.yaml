apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      # Kubernetes injects legacy service-link env vars (e.g. AGENT_SERVICE_PORT=tcp://…)
      # that collide with the service's own *_PORT settings; DNS names are used instead.
      enableServiceLinks: false
      containers:
        - name: agent-service
          image: luban-aiops/agent-service:dev-local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          env:
            # SPEC-037 R-2: signs approved execution requests at resume;
            # verified at the invocation boundary. An absent secret/key
            # fails closed (audited signing_unavailable rejection) — the
            # platform never degrades to unsigned mutating execution.
            - name: AGENT_EXECUTION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: execution-signing-secret
                  key: AGENT_EXECUTION_SIGNING_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: platform-runtime-config
            - configMapRef:
                name: agent-platform-runtime-profile
            - secretRef:
                name: agent-platform-runtime-secrets
                optional: true
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: agent-workspaces
              mountPath: /var/lib/luban-aiops/workspaces
      volumes:
        - name: agent-workspaces
          emptyDir: {}
