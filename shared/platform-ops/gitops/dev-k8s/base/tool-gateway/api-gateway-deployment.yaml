apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: luban-aiops/api-gateway:dev-local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-runtime-config
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: gateway-policy
              mountPath: /etc/luban/policy
              readOnly: true
      volumes:
        - name: gateway-policy
          configMap:
            name: gateway-policy
