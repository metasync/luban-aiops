---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tool-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tool-gateway-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tool-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: tool-gateway
roleRef:
  kind: Role
  name: tool-gateway-readonly
  apiGroup: rbac.authorization.k8s.io
