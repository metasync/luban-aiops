apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
  template:
    metadata:
      labels:
        app: web-ui
    spec:
      containers:
        - name: web-ui
          image: luban-aiops/web-ui:dev-local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
