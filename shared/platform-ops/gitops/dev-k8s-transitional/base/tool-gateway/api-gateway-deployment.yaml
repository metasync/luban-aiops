apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: luban-aiops/api-gateway:dev-local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-runtime-config
          ports:
            - containerPort: 8000
