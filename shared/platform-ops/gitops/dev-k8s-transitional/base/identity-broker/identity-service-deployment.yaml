apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: luban-aiops/identity-service:dev-local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-runtime-config
            - secretRef:
                name: identity-service-runtime-secrets
                optional: true
          ports:
            - containerPort: 8000
