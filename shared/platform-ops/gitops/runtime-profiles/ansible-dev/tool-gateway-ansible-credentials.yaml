# Strategic merge patch applied by the dev-k8s overlay (SPEC-069 R-6):
# mounts the Ansible MCP credential-set secret the gateway's ingestion
# connector resolves GATEWAY_ANSIBLE_MCP_CREDENTIAL_SET ("ansible-mock")
# from, at the GATEWAY_ANSIBLE_MCP_CREDENTIAL_SETS path.
#
# Like the browser sidecar patch (browser-dev/tool-gateway-browser-sidecar.yaml)
# this is declared by the dev-k8s overlay, NOT listed under the profile's own
# resources: a strategic merge patch needs its Deployment target in scope, and
# the tool-gateway Deployment lives in the base the overlay assembles.
#
# The secret is written by sync-ansible-credentials.sh (one generator / two
# sinks — the mock's bearer gate reads the same token). It is optional so the
# pod still starts before that script runs; the connector then fails closed at
# call time (CREDENTIAL_SET_NOT_FOUND) rather than dialing the mock unauthed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
spec:
  template:
    spec:
      containers:
        - name: tool-gateway
          volumeMounts:
            - name: ansible-credentials
              mountPath: /etc/luban/ansible-credentials
              readOnly: true
      volumes:
        - name: ansible-credentials
          secret:
            secretName: tool-gateway-ansible-credentials
            optional: true
