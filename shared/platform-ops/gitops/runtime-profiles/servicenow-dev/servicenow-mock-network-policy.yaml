# Defense-in-depth NetworkPolicy for the thin mock ServiceNow Table-API responder
# (SPEC-067 R-6).
#
# The mock is already bearer-gated (it 401s any Table-API request without the
# access token its /oauth_token.do issued, and 401s a token request without the
# shared client_id/client_secret from the servicenow-mock-credentials secret).
# This policy is the network-layer second control: selecting the pod with an
# Ingress policyType makes it deny-by-default, and the single rule admits port
# 8000 only from the tool-gateway pod — the sole legitimate ServiceNow client.
# No other workload in the namespace can reach the mock, so a compromised
# neighbour cannot probe it or replay the credential.
#
# Egress is left unrestricted on purpose: the mock is a pure server and initiates
# no outbound connections, so an egress rule would add noise without tightening
# anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servicenow-mock-allow-tool-gateway
  labels:
    app: servicenow-mock-table-api
spec:
  podSelector:
    matchLabels:
      app: servicenow-mock-table-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tool-gateway
      ports:
        - protocol: TCP
          port: 8000
