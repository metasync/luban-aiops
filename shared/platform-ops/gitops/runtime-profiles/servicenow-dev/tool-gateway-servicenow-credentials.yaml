# Strategic merge patch applied by the dev-k8s overlay (SPEC-067 R-6):
# mounts the ServiceNow credential-set secret the gateway's native connector
# resolves GATEWAY_SERVICENOW_CREDENTIAL_SET ("servicenow-mock") from, at the
# GATEWAY_SERVICENOW_CREDENTIAL_SETS path.
#
# Like the ansible credential patch
# (ansible-dev/tool-gateway-ansible-credentials.yaml) and the browser sidecar
# patch (browser-dev/tool-gateway-browser-sidecar.yaml) this is declared by the
# dev-k8s overlay, NOT listed under the profile's own resources: a strategic merge
# patch needs its Deployment target in scope, and the tool-gateway Deployment lives
# in the base the overlay assembles.
#
# The secret is written by sync-servicenow-credentials.sh (one generator / two
# sinks — the mock's OAuth responder validates the same client_id/client_secret).
# It is optional so the pod still starts before that script runs; the connector
# then fails closed at call time (CREDENTIAL_SET_NOT_FOUND) rather than dialing the
# mock unauthed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
spec:
  template:
    spec:
      containers:
        - name: tool-gateway
          volumeMounts:
            - name: servicenow-credentials
              mountPath: /etc/luban/servicenow-credentials
              readOnly: true
      volumes:
        - name: servicenow-credentials
          secret:
            secretName: tool-gateway-servicenow-credentials
            optional: true
