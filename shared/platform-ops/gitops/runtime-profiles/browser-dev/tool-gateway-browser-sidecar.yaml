# Strategic merge patch applied by the dev-k8s overlay (SPEC-049 R-1,
# R-7): adds the chromium-headless-shell sidecar that the tool-gateway
# connects to over CDP (ws://localhost:9222, bound to loopback) and
# mounts the credential-set secret consumed by web.fill_credential.
#
# The gateway image itself ships the Playwright library only — no
# browser binary — per the D-6 sidecar decision: the browser engine is
# a deployment-level concern and stays out of the gateway image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
spec:
  template:
    spec:
      containers:
        - name: tool-gateway
          volumeMounts:
            - name: browser-credentials
              mountPath: /etc/luban/browser-credentials
              readOnly: true
        # C-1 (SPEC-049): the chromedp/headless-shell entrypoint defaults
        # to --remote-debugging-address=0.0.0.0, exposing CDP on the pod
        # IP (cluster-routable) so any pod could drive the browser and
        # bypass the gateway's allowlist, flow binding, and credential
        # masking. Pin command/args to bind CDP to loopback only: the
        # gateway reaches it over ws://localhost:9222 in the shared pod
        # netns, and no off-pod client can. The port is pinned too so a
        # floating :stable default (it drifted to 9223) can't silently
        # diverge from GATEWAY_BROWSER_CDP_ENDPOINT.
        - name: browser
          image: chromedp/headless-shell:stable
          imagePullPolicy: IfNotPresent
          command: ["/headless-shell/headless-shell"]
          args:
            - --no-sandbox
            - --use-gl=angle
            - --use-angle=swiftshader
            - --remote-debugging-address=127.0.0.1
            - --remote-debugging-port=9222
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 9222
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        # Created by sync-browser-credentials.sh; optional so the pod
        # still starts before credential sets are provisioned
        # (web.fill_credential then errors fail-closed at call time).
        - name: browser-credentials
          secret:
            secretName: tool-gateway-browser-credentials
            optional: true
        - name: browser-shm
          emptyDir: {}
