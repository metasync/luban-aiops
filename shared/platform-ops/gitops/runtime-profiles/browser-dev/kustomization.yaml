# Browser web-check dev posture (SPEC-049 R-7).
#
# Like mutating-dev (SPEC-022 R-3) this is not an LLM provider profile:
# it is the committed browser-check posture for dev environments. It
# ships the sample target application the browser tools are allowed to
# visit (browser-check-target, the only origin in browser.env's
# GATEWAY_BROWSER_ALLOW_ORIGINS), and browser.env provides the
# GATEWAY_BROWSER_* values that dev-k8s merges into the
# platform-runtime-config ConfigMap. The merge and the sidecar patch are
# declared by the dev-k8s overlay (where the ConfigMap is accumulated
# and the tool-gateway Deployment lives) because kustomize
# `behavior: merge` generators and Deployment patches need their targets
# in scope.
#
# tool-gateway-browser-sidecar.yaml is therefore deliberately NOT listed
# under resources here: it is a strategic merge patch applied by the
# dev-k8s overlay, not a standalone resource.
#
# The base stays deny-by-default: base/tool-gateway/runtime-config.env
# keeps GATEWAY_BROWSER_ENABLED=false, and the origin allowlist denies
# every navigation unless an origin is configured.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - browser-check-target-deployment.yaml
  - browser-check-target-service.yaml
  - browser-check-target-pages.yaml
