# Browser web-check dev posture (SPEC-049 R-7; static target retired by
# SPEC-061).
#
# Like mutating-dev (SPEC-022 R-3) this is not an LLM provider profile:
# it is the committed browser posture for dev environments. It ships the
# browser sidecar's NetworkPolicy and browser.env, which provides the
# GATEWAY_BROWSER_* values that dev-k8s merges into the
# platform-runtime-config ConfigMap. The one permitted origin
# (GATEWAY_BROWSER_ALLOW_ORIGINS) is `acme-admin`, the SPEC-059 sample
# application deployed out-of-band by `make deploy-sample-app`; this
# profile no longer ships a target of its own, SPEC-061 having retired
# the static `browser-check-target` mock. The merge and the sidecar patch
# are declared by the dev-k8s overlay (where the ConfigMap is accumulated
# and the tool-gateway Deployment lives) because kustomize
# `behavior: merge` generators and Deployment patches need their targets
# in scope.
#
# tool-gateway-browser-sidecar.yaml is therefore deliberately NOT listed
# under resources here: it is a strategic merge patch applied by the
# dev-k8s overlay, not a standalone resource.
#
# The base stays deny-by-default: base/tool-gateway/runtime-config.env
# keeps GATEWAY_BROWSER_ENABLED=false, and the origin allowlist denies
# every navigation unless an origin is configured.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - browser-sidecar-network-policy.yaml
