apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  # ClusterIP only — the model server is never exposed outside the
  # cluster; the platform reaches it via in-cluster DNS:
  # http://ollama.<namespace>.svc:11434/v1
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
