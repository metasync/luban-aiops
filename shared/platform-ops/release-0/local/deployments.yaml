    spec:
      containers:
        - name: agent-service
          image: ghcr.io/metasync/luban-aiops/agent-service:release-0-dev
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
spec:
  selector:
    app: agent-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
