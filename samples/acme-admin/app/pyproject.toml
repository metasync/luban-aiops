[project]
name = "acme-admin"
version = "0.1.0"
description = "ACME user-administration console — the tutorial target for the acme-admin sample suite (SPEC-059)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
acme-admin = "acme_admin.main:run"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0"
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
