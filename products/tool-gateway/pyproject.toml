[project]
name = "api-gateway"
version = "0.1.0"
description = "Release 0 placeholder API gateway for Luban AIOps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
api-gateway = "api_gateway.main:run"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
