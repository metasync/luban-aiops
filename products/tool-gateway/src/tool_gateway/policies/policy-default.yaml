# Default action-authorization policy bundle (v1).
#
# Scope: action_authz domain only, allow/deny/require_approval outcomes — a
# strict subset of the Tier-1 policy specification
# (docs/agentic-aiops-platform/policy-specification.md).
#
# Version discipline (SPEC-048 R-1): ``version`` is the bundle *format* version
# — the schema revision ``validate_policy.py`` accepts (pinned to 1) — not a
# rule-revision counter, so it does not bump on rule edits. Rule changes are
# governed by review discipline: Git history is the authority and there is no
# cross-commit monotonicity machinery. The running gateways additionally expose
# a SHA-256 fingerprint of the exact loaded bundle text on the matrix/readiness
# surfaces, so a deploy can be confirmed against the canonical file without
# shelling into the pod.
#
# Semantics (enforced by the gateway policy engine):
#   - deny by default: no matching rule => deny
#   - explicit deny overrides require_approval and allow
#   - require_approval overrides allow (SPEC-030)
#   - higher priority wins within an outcome class
#   - disabled rules are ignored
#
# Approval tiers (SPEC-030): a require_approval rule carries an approval
# block. tier_1 keeps the decision with the session operator themself
# (destructive-but-routine actions); tier_2 requires a designated approver
# distinct from the requester (critical destructive actions).
#
# tier_1 authoring pattern for destructive-but-routine actions:
#   decision:
#     outcome: require_approval
#     approval:
#       tier: tier_1
#       decided_by_roles: ["operator", "platform-admin"]
# tier_1 allows self-approval by default, so the operator working with the
# agent confirms their own parked call. Declare the level explicitly instead
# of relying on the implicit no-rule path.
#
# Synthetic identities (workload clients holding the developer role) are
# excluded from approval decisions by authoring — omit them from
# decided_by_roles — never by code special cases.
#
# Action naming convention: <resource>:<verb>; bare "chat" for the chat action.
#
# read-only-observer is granted chat/session:create/session:read per the
# authorization matrix ("chat and service query"): chat is conversational today
# (a read surface). When chat gains a mutating capability, that capability gets
# its own action name and observer is denied it by default.
#
# session:list/session:delete (SPEC-022) mirror session:create's grants: the
# API scopes both operations to the caller's own sessions server-side, so the
# lifecycle actions share one posture across all roles. session:update
# (SPEC-039 R-7, owner session rename) joins them: it is likewise scoped
# server-side to the caller's own sessions, so it rides the same grants.
version: 1
rules:
  - id: allow-operators-chat
    domain: action_authz
    description: Operational and developer roles may use chat and manage sessions.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["chat", "session:create", "session:read", "session:list", "session:delete", "session:update", "models:list"]
    decision:
      outcome: allow

  - id: allow-observer-read-and-chat
    domain: action_authz
    description: Read-only observers may query via chat and view sessions.
    priority: 100
    enabled: true
    match:
      roles_any: ["read-only-observer"]
      actions_any: ["chat", "session:create", "session:read", "session:list", "session:delete", "session:update", "models:list"]
    decision:
      outcome: allow

  # chat:confirm answers a parked kernel confirmation (SPEC-020): it can
  # release a mutating tool call, so it gets its own action name and
  # read-only-observer is denied it by default, per the convention above.
  - id: allow-chat-confirm
    domain: action_authz
    description: Operational and developer roles may approve or deny parked tool confirmations.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["chat:confirm"]
    decision:
      outcome: allow

  # tools:invoke covers read-risk tool execution; the tool-gateway scopes
  # invocation by risk tier (SPEC-021 R-1): read tools require tools:invoke,
  # write/admin tools additionally require tools:mutate below. Observer
  # keeps tier-0 read access; mutating execution stays deny-by-default for
  # every role not explicitly granted tools:mutate. approver joins the
  # invocation grants because a tier_2-approved call resumes under the
  # confirmer's delegated token (SPEC-030 R-3): without it the approved
  # execution would fail closed at admission. Two-person control is
  # preserved — an approver's own parked call still needs a distinct
  # designated approver (self-approval is blocked on tier_2).
  - id: allow-operators-tools
    domain: action_authz
    description: Operational, developer, approver, and observer roles may invoke read-only tools.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["tools:invoke"]
    decision:
      outcome: allow

  # targets:authorize (SPEC-070 OQ-7): gates the human-initiated outbound
  # user-delegated authorization workflow (start/status/cancel/browser-reset on
  # the tool-gateway's /api/v2/targets/authorizations routes). Granted to exactly
  # the tools:invoke holders above — a requester may only drive enrollment for a
  # target they may already invoke on behalf of — so no target role is
  # synthesized and observer keeps its read-invocation posture. This grant is
  # necessary but not sufficient: the route additionally rechecks the
  # administered owner->account mapping and the current invocation entitlement
  # and scopes every operation to the verified owner, so holding targets:authorize
  # alone enrolls nothing. auditor is denied by default (governance-only, no
  # invocation surface). The bearerless provider-url/callback handoffs are not
  # policy-gated here — they authenticate the platform-gateway workload identity.
  - id: allow-operators-targets-authorize
    domain: action_authz
    description: Operational, developer, approver, and observer roles may drive outbound user-delegated target authorization for targets they may invoke.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["targets:authorize"]
    decision:
      outcome: allow

  # Mutating tool execution (SPEC-021): granted to the execution roles per the
  # authorization matrix's restart-service example. approver carries the grant
  # so a tier_2-approved call can execute on the confirmer's delegated token
  # (SPEC-030 R-3); the require_approval rule below still wins by precedence,
  # so every mutating run — including an approver's own — parks behind a
  # designation distinct from the requester. developer and read-only-observer
  # are denied by default. Extending the grant (e.g. to developer) is a
  # deliberate bundle edit documented in the Approval and HITL Governance Guide.
  - id: allow-operators-tools-mutate
    domain: action_authz
    description: Platform admins, operators, and approvers may execute mutating (write/admin risk) tools.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["tools:mutate"]
    decision:
      outcome: allow

  # External delivery of a generated secret (SPEC-062 R-4/D-3): secrets:deliver
  # is a distinct action from tools:mutate so a deployment can grant "mutate
  # infrastructure" separately from "email a secret to a third party". Granted to
  # the same operational roles; approver carries it so a tier_2-approved send
  # executes on the confirmer's delegated token (SPEC-030 R-3). secrets.deliver is
  # write-tier, so the require-approval-tools-mutate rule below still wins by
  # precedence on its tools:mutate leg and every send parks behind a designation
  # distinct from the requester — this grant is the *additional* action the
  # gateway's per-tool extra-action hook checks at admission. The portal-copy
  # handoff (R-3) needs no action (owner-scoped retrieval of a value the
  # operator's own session generated) but is still audited.
  - id: allow-operators-secrets-deliver
    domain: action_authz
    description: Platform admins, operators, and approvers may deliver a generated secret over an external channel (email).
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["secrets:deliver"]
    decision:
      outcome: allow

  # Tiered approval for mutating execution (SPEC-030 R-4): every mutating run
  # parks behind a tier_2 requirement, enforced on the platform-gateway
  # chat:confirm path — only a designated approver or platform admin OTHER
  # than the requesting operator may approve. The allow rule above stays: the
  # tool-gateway admission still evaluates tools:mutate allow/deny on the
  # confirmer's delegated token (SPEC-021 unchanged). roles_any spans every
  # chat:confirm holder so the requirement rides whichever identity reaches
  # the parked call; developer is deliberately absent from decided_by_roles
  # (synthetic-identity exclusion by authoring, see header comment).
  - id: require-approval-tools-mutate
    domain: action_authz
    description: Mutating tool execution requires tier-2 approval by a designated approver distinct from the requester.
    priority: 200
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["tools:mutate"]
    decision:
      outcome: require_approval
      approval:
        tier: tier_2
        decided_by_roles: ["approver", "platform-admin"]

  # Bounded autonomous diagnosis (SPEC-076 R-5/OQ-4): the canonical agent-role
  # axis encoding. Phase 5 binds the role IN-PROCESS (toolkit narrowing + audit
  # attribution), but SPEC-073 R-3 keeps it OFF every wire field — so no deployed
  # gateway evaluate() threads a non-None agent_role and these rules stay
  # READY-BUT-INERT, never matching on the live orchestration path. The live
  # read-only control is in-process SPEC-073 narrowing (a diagnostician gets no
  # mutating tool) + the loop's read_only=True admission (R-8 point 3 / OQ-4:
  # "narrowing already suffices"); this rule is the policy-layer mirror that fires
  # only once a role IS threaded — the phase-6 wire contract, or the FU-076-c
  # in-process evaluation point. Subtractive-only and fail-closed: agent_roles_any
  # never matches an unscoped call (agent_role None), so every deployed evaluation
  # without a bound role stays byte-identical. Deny overrides allow/require_approval,
  # so this wins over the mutating grants above whenever a diagnostician role is
  # threaded.
  - id: deny-diagnostician-tools-mutate
    domain: action_authz
    description: A diagnostician agent-role can never execute a mutating tool (read-only orchestration loop, SPEC-076 R-5).
    priority: 300
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["tools:mutate"]
      agent_roles_any: ["diagnostician"]
    decision:
      outcome: deny

  # An ``executor`` agent-role staging a remediation is the role-scoped encoding
  # of the diagnose-before-act ceiling (SPEC-076 R-4). Phase 5 delivers + unit-proves
  # the executor-staging MECHANISM (stage_remediation parks a proposal on the HITL
  # card) but wires NO production trigger — the operator-initiated diagnose->act
  # bridge is FU-076-b — so this rule is doubly inert in deployment: nothing threads
  # an executor role (R-3 keeps it off the wire) and nothing stages yet. When wired,
  # its mutation parks behind a tier_2 approval decided by a distinct human — never
  # an agent (the executor->human-approver disjointness invariant, SPEC-074 R-3).
  # Deliberately redundant with the human-axis require-approval-tools-mutate above so
  # the outcome is identical whichever identity reaches the parked call. require_approval
  # is enforced on the platform-gateway confirm path (the tool-gateway skips it at
  # load, SPEC-030 R-2).
  - id: require-approval-executor-tools-mutate
    domain: action_authz
    description: An executor agent-role staging a mutating tool requires tier-2 approval by a distinct human (SPEC-076 R-4/R-5).
    priority: 200
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["tools:mutate"]
      agent_roles_any: ["executor"]
    decision:
      outcome: require_approval
      approval:
        tier: tier_2
        decided_by_roles: ["approver", "platform-admin"]

  - id: allow-operators-tools-list
    domain: action_authz
    description: Operational, developer, approver, and observer roles may list available tools.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["tools:list"]
    decision:
      outcome: allow

  # audit:read exposes cross-user activity and is therefore restricted to the
  # governance roles per the authorization matrix (auditor: "view audit trails").
  - id: allow-auditors-audit-read
    domain: action_authz
    description: Auditors and platform admins may query the durable audit trail.
    priority: 100
    enabled: true
    match:
      roles_any: ["auditor", "platform-admin"]
      actions_any: ["audit:read"]
    decision:
      outcome: allow

  # Incident vocabulary (SPEC-015): incident:read is a viewing surface, so
  # read-only-observer joins the operational roles; incident:create and
  # incident:triage stay with the operational/developer roles. Triage next
  # steps are advisory only — no execution action exists in R3.
  - id: allow-operators-incident-read
    domain: action_authz
    description: Operational, developer, and observer roles may view incidents and triage reports.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["incident:read"]
    decision:
      outcome: allow

  - id: allow-operators-incident-create
    domain: action_authz
    description: Operational and developer roles may report manual incidents.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["incident:create"]
    decision:
      outcome: allow

  - id: allow-operators-incident-triage
    domain: action_authz
    description: Operational and developer roles may initiate agent triage of an incident.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer"]
      actions_any: ["incident:triage"]
    decision:
      outcome: allow

  # Transparency vocabulary (SPEC-019): policy:read serves the live
  # permission-matrix view. The gateway scopes rows server-side (full matrix
  # for platform-admin, own roles otherwise), so granting the action to every
  # role exposes no cross-role data.
  - id: allow-all-policy-read
    domain: action_authz
    description: Every platform role may view its effective policy permissions.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["policy:read"]
    decision:
      outcome: allow

  # skills:read serves the workspace skills inventory through the
  # platform-gateway proxy; skills are shared guidance resources, so every
  # role may list them (same posture as tools:list for the read-only toolset).
  - id: allow-all-skills-read
    domain: action_authz
    description: Every platform role may list the federated skills inventory.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator", "developer", "read-only-observer"]
      actions_any: ["skills:read"]
    decision:
      outcome: allow

  # approvals:list serves the cross-session confirmation inbox (SPEC-031 R-3).
  # The inbox deliberately exposes other users' parked requests (metadata only,
  # SPEC-030 Q-1 transcript posture unchanged), so it is restricted to the
  # roles that may actually decide tier_2 approvals.
  - id: allow-approvers-approvals-list
    domain: action_authz
    description: Approvers and platform admins may list the cross-session confirmation inbox.
    priority: 100
    enabled: true
    match:
      roles_any: ["approver", "platform-admin"]
      actions_any: ["approvals:list"]
    decision:
      outcome: allow

  # Operations document repository (SPEC-039 R-2): documents:create gates
  # create/publish/delete of one's own documents; documents:read gates list/get.
  # The agent layer enforces the visibility matrix (drafts owner-only, published
  # to all readers), so no per-document grant surface exists. developer and
  # read-only-observer are denied both by default — document production is an
  # operational act; extending the grant is a deliberate bundle edit.
  - id: allow-operators-documents
    domain: action_authz
    description: Platform admins, approvers, and operators may create and read operations documents.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["documents:create", "documents:read"]
    decision:
      outcome: allow

  # Skill-draft export (SPEC-044 R-3): session:skill_draft gates the
  # generation of a skill draft from one of the caller's own sessions.
  # The output is an ephemeral, validated Markdown handover — nothing is
  # published — but drafting skills for the team repository is an
  # operational act, so it follows the documents-create grant pattern:
  # developer and read-only-observer are denied by default.
  - id: allow-operators-skill-draft
    domain: action_authz
    description: Platform admins, approvers, and operators may draft skills from their own sessions.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["session:skill_draft"]
    decision:
      outcome: allow

  # Incident-anchored skill drafts (SPEC-045 R-3): incident:skill_draft
  # gates converting an incident's validated triage into a skill draft.
  # The route dual-gates with incident:read, so this grant alone never
  # admits a caller who cannot see the incident; developer and
  # read-only-observer keep incident:read but stay denied here (same
  # operational-act posture as the session sibling).
  - id: allow-operators-incident-skill-draft
    domain: action_authz
    description: Platform admins, approvers, and operators may draft skills from an incident's validated triage.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["incident:skill_draft"]
    decision:
      outcome: allow

  # Skill graduation (SPEC-055 R-4 / OQ-3): session:skill_graduate gates
  # graduating a session's captured authoring trace into an executable-flow
  # skill draft. A higher trust level than session:skill_draft — the output
  # declares risk_class: write and a machine-readable replay step list, not
  # knowledge prose — so it is separately authorized and audited rather than
  # folded into the draft grant (OQ-3). Same operational-role posture: platform
  # admins, approvers, and operators; developer and read-only-observer denied.
  - id: allow-operators-skill-graduate
    domain: action_authz
    description: Platform admins, approvers, and operators may graduate a session's authoring trace into an executable-flow skill draft.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["session:skill_graduate"]
    decision:
      outcome: allow

  # Runtime feature-flag inventory (SPEC-072 R-5): runtime:flags gates an
  # authenticated read of how the platform is deployed/configured. An
  # operational concern rather than a chat-surface read like models:list, so it
  # follows the operational-trio grant posture (documents:read /
  # session:skill_graduate): platform admins, approvers, and operators;
  # developer, read-only-observer, and auditor denied by default.
  - id: allow-operators-runtime-flags
    domain: action_authz
    description: Platform admins, approvers, and operators may read the runtime feature-flag inventory.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "approver", "operator"]
      actions_any: ["runtime:flags"]
    decision:
      outcome: allow

  # Operator-initiated diagnose→act staging trigger (SPEC-077 R-3 / OQ-3):
  # remediate:stage gates the production trigger that reaches the delivered
  # executor-scoped stage_remediation(...). A NEW deny-by-default action rather
  # than the existing chat grant, because staging is mutation-adjacent — it opens
  # one read_only=False executor turn that PROPOSES a single mutating call, which
  # the kernel parks as the existing SPEC-020/030/031 HITL card (labelled
  # staged_by_role="executor") and never dispatches here. Granted to platform
  # admins and operators — the roles that drive an incident response. Approver is
  # deliberately NOT granted: the stager and the distinct-human approver who
  # resumes the parked card must stay disjoint (SPEC-074 executor→distinct-human-
  # approver; SPEC-030 self-approval block), so separating the trigger role from
  # the approval role enforces that invariant at the policy layer too. This gates
  # the TRIGGER only — necessary, not sufficient: the staged proposal still parks
  # behind require-approval-executor-tools-mutate (tier_2) and a distinct-human
  # approval before the at-most-one-dispatch worker (SPEC-037/038/063) acts.
  # developer, read-only-observer, auditor, and approver are denied by default.
  # Registered in BOTH engines' PROTECTED_ACTIONS so the action surfaces in both
  # policy matrices and both scenario-coverage tables (SPEC-077 R-3, ratified
  # "both gateway evaluate() engines"); the enforcement point is the platform-
  # gateway POST /api/v1/remediate proxy — the tool-gateway carries it for matrix
  # parity but has no route that evaluates it.
  - id: allow-operators-remediate-stage
    domain: action_authz
    description: Platform admins and operators may trigger staging of a proposed remediation from a completed diagnosis.
    priority: 100
    enabled: true
    match:
      roles_any: ["platform-admin", "operator"]
      actions_any: ["remediate:stage"]
    decision:
      outcome: allow
