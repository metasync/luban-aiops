[project]
name = "identity-service"
version = "0.1.0"
description = "Release 0 placeholder identity broker for Luban AIOps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
identity-service = "identity_service.main:run"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
