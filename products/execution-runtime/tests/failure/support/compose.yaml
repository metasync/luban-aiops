services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spec063
      POSTGRES_DB: spec063
      POSTGRES_PASSWORD: ${SPEC063_DB_PASSWORD:?generated by harness}
    command: ["postgres", "-c", "fsync=on", "-c", "full_page_writes=on", "-c", "synchronous_commit=on"]
    ports:
      - "127.0.0.1::5432"
    labels:
      io.luban.spec063.owner: ${SPEC063_OWNER:?generated by harness}
    volumes:
      - ledger:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U spec063 -d spec063"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  ledger:
    labels:
      io.luban.spec063.owner: ${SPEC063_OWNER:?generated by harness}
networks:
  default:
    driver: bridge
    labels:
      io.luban.spec063.owner: ${SPEC063_OWNER:?generated by harness}
