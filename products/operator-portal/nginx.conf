server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://platform-gateway:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # SPEC-023 coexistence: the Vite rebuild ships under /next/ while the
    # legacy vanilla trio keeps serving /. Content-hash filenames make the
    # bundle assets immutable-cacheable (SPEC-023 R-1).
    # ^~ so this prefix wins over the legacy regex location below.
    location ^~ /next/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /next/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /next/index.html;
    }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
