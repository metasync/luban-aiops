# No request-derived strings: even parse failures before location routing can
# contain callback secrets. Status/timing remain available without raw context.
log_format portal_safe 'status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 8080 default_server;
    access_log /var/log/nginx/access.log portal_safe;
    # Request-context error messages cannot be safely formatted in nginx.
    # Main-context startup diagnostics remain on the inherited process logger.
    error_log /dev/null;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Private workload routes are never a browser API.
    location ^~ /api/v2/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://platform-gateway:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # v0.23.3: the Settings Platform pane probes the gateway's health
    # endpoints; route them through instead of the SPA fallback.
    location /health/ {
        proxy_pass http://platform-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # SPEC-023 R-1: content-hashed bundle assets are immutable-cacheable;
    # index.html stays no-store so deploys roll over immediately and the
    # SPA fallback keeps client routing intact.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
