<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luban AIOps Portal</title>
    <link rel="stylesheet" href="./styles.css?v=20260810-evidence-drawer" />
  </head>
  <body>
    <div class="chat-shell">
      <!-- Top bar -->
      <header class="top-bar">
        <h1 class="top-bar-title">Luban AIOps</h1>
        <div class="top-bar-status">
          <span id="identity-badge" class="identity-badge">Not signed in</span>
          <button id="login-button" type="button" class="btn-sm">Login</button>
          <button id="logout-button" type="button" class="btn-sm" hidden>Logout</button>
        </div>
      </header>

      <!-- Main chat area -->
      <main class="chat-main">
        <div id="response-output" class="chat-messages">
          <p class="chat-placeholder">Ask the agent about your infrastructure.</p>
        </div>
      </main>

      <!-- Tool evidence drawer (SPEC-011 R-4): supportive detail, collapsed
           by default so it never crowds the streamed response. -->
      <details id="evidence-drawer" class="evidence-drawer">
        <summary>
          <span class="evidence-drawer-title">Tool Evidence</span>
          <span id="evidence-summary" class="evidence-summary">no tool calls this turn</span>
        </summary>
        <div id="evidence-cards" class="evidence-cards"></div>
      </details>

      <!-- Prompt input (fixed bottom) -->
      <footer class="chat-input-bar">
        <textarea id="prompt-input" rows="2" placeholder="Ask about pods, services, logs, alerts..."></textarea>
        <button id="stream-button" type="button" class="btn-send">Send</button>
      </footer>

      <!-- Collapsible settings drawer -->
      <details class="settings-drawer">
        <summary>Settings &amp; Debug</summary>
        <div class="settings-grid">
          <div class="settings-section">
            <h3>Gateway</h3>
            <label for="gateway-url">Base URL</label>
            <input id="gateway-url" placeholder="Defaults to current origin" />
            <label for="user-id">User ID</label>
            <input id="user-id" value="demo.operator" />
            <div class="actions">
              <button id="normalize-button" type="button">Normalize Identity</button>
              <button id="session-button" type="button">Create Session</button>
              <button id="send-button" type="button">Send (non-stream)</button>
            </div>
          </div>
          <div class="settings-section">
            <h3>Session</h3>
            <dl class="metadata">
              <div><dt>Session ID</dt><dd id="session-id">Not created</dd></div>
              <div><dt>Request ID</dt><dd id="request-id">Pending</dd></div>
            </dl>
          </div>
          <div class="settings-section">
            <h3>Identity</h3>
            <pre id="identity-output">No authenticated identity yet.</pre>
          </div>
        </div>
      </details>
    </div>

    <script src="./app.js?v=20260810-evidence-drawer"></script>
  </body>
</html>
