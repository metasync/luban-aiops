[project]
name = "agent-service"
version = "0.1.0"
description = "Release 0 placeholder runtime service for the Luban AIOps agent platform."
requires-python = ">=3.11"
dependencies = [
  "agentscope>=2.0.4,<3.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.scripts]
agent-service = "agent_service.main:run"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
